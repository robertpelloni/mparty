name: mario_party_4
sha1: "" # Add your target SHA1 here
options:
  basename: mario_party_4
  target_path: baserom.mp4.iso
  base_path: .
  compiler: GCC
  find_file_boundaries: True
  header_encoding: ASCII
  asm_path: asm/mp4
  src_path: src/mp4
  asset_path: assets/mp4
  non_matchings_path: asm/nonmatchings/mp4
segments:
  - name: header
    type: header
    start: 0x0

  - name: boot
    type: bin
    start: 0x40

  - name: main
    type: code
    start: 0x1000
    vram: 0x80003100
    subsegments:
      - [0x1000, c]
      - [0x100000, data]

  - name: overlays
    type: code
    start: 0x100000 # Placeholder start for overlays
    vram: 0x80200000
    subsegments:
      - [0x100000, c]

  - [0x200000] # End of ROM marker placeholder
